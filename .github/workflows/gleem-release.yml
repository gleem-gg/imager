# Builds Gleem Imager for Windows and Linux.
#
# - Every push to `gleem`, every `gleem-vX.Y.Z` tag and every pull request
#   builds both and keeps them as workflow artifacts. The Windows installer is
#   unsigned: the code-signing key is on a USB token, so gleem/release.sh signs
#   it on a machine with the token and publishes the release from there.
# - A push to `gleem` that changes gleem/os_list.json or gleem/icons/ publishes the image list and its
#   icons to https://get.gleem.gg/imager/.
#
# Secret: BUNNY_STORAGE_PASSWORD (storage zone gleem-cli only).
name: Gleem Imager

on:
  push:
    branches: [gleem]
    tags: ['gleem-v*']
  pull_request:
    branches: [gleem]
  workflow_dispatch:

env:
  QT_VERSION: 6.11.1

jobs:
  linux:
    name: Linux AppImage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the version comes from gleem-v tags

      - name: Build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config file fuse libfuse2 \
            libgnutls28-dev libudev-dev liburing-dev libdbus-1-dev libglib2.0-dev \
            libgl1-mesa-dev libegl1-mesa-dev libdrm-dev libgbm-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libfontconfig1-dev libfreetype6-dev libx11-xcb-dev \
            libxcb1-dev libxcb-cursor-dev libxcb-icccm4-dev libxcb-image0-dev \
            libxcb-keysyms1-dev libxcb-randr0-dev libxcb-render-util0-dev \
            libxcb-shape0-dev libxcb-xinerama0-dev libxcb-xkb-dev libwayland-dev

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: linux_gcc_64
          modules: qtimageformats
          cache: true

      - name: Build the AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: ./create-appimage.sh --arch=x86_64 --qt-root="$QT_ROOT_DIR"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: Gleem_Imager-*.AppImage
          if-no-files-found: error

  windows:
    name: Windows installer
    runs-on: windows-2022
    steps:
      # A few upstream files are stored with CRLF line endings. With the
      # runner's autocrlf they show as modified after checkout, and the
      # version comes out as vX.Y.Z-dirty.
      - name: Check out files exactly as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: The tree must be clean
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git status --porcelain
            echo "::error::the checkout is not clean, the version would be -dirty"
            exit 1
          fi

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_mingw
          tools: tools_mingw1310
          # Qt 6.11 moved each Windows toolchain into its own repository
          # folder (qt6_6111_mingw/ ...), which aqtinstall 3.3.0 cannot read yet.
          # Pinned to a main-branch commit that can; back to a release once
          # one supports it.
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7
          modules: qtimageformats
          cache: true

      - name: Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build
        shell: pwsh
        run: |
          $mingw = Join-Path $env:IQTA_TOOLS 'mingw1310_64'
          $env:PATH = "$mingw\bin;$env:PATH"
          cmake -S src -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DQt6_ROOT="$env:QT_ROOT_DIR" -DMINGW64_ROOT="$mingw" `
            -DENABLE_INNO_INSTALLER=ON
          cmake --build build --parallel
          cmake --build build --target inno_installer

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/installer/gleem-imager-*.exe
          if-no-files-found: error

  oslist:
    name: Publish the OS list
    # On a manual run it always publishes (no "before" to compare with).
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/gleem'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Changed?
        id: changed
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # Compare with what the branch pointed at before this push, which may
          # be several commits back; a new branch has no "before" (all zeros).
          if [[ "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "publish=yes" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE" HEAD -- gleem/os_list.json gleem/icons/; then
            echo "publish=no" >> "$GITHUB_OUTPUT"
          else
            echo "publish=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate against the schema
        if: steps.changed.outputs.publish == 'yes'
        run: |
          pip install -q jsonschema
          python3 -c "import json,jsonschema; jsonschema.validate(json.load(open('gleem/os_list.json')), json.load(open('doc/json-schema/os-list-schema.json')))"

      - name: Upload
        if: steps.changed.outputs.publish == 'yes'
        env:
          BUNNY_STORAGE_PASSWORD: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
        run: |
          set -euo pipefail
          storage="https://storage.bunnycdn.com/gleem-cli/imager"
          put() {
            curl -fsS -X PUT -H "AccessKey: $BUNNY_STORAGE_PASSWORD" \
              -H "Content-Type: $2" --data-binary @"$1" "$storage/$3"
            echo "  $3"
          }
          # Icons first: the list refers to them. The list is cached for 60 s.
          for f in gleem/icons/*.png; do put "$f" image/png "icons/$(basename "$f")"; done
          put gleem/os_list.json application/json os_list.json
